<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Food Construct</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">

    <div class="login-card">
        <h2>Вход в аккаунт</h2>

        <form action="https://postman-echo.com/post" method="POST" target="_blank">
            <label for="login">Логин:</label>
            <input type="text" id="login" name="login" placeholder="Введите логин" required>

            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль" required>

            <label class="checkbox-label">
                <input type="checkbox" name="remember" value="yes">
                Запомнить меня
            </label>

            <button type="submit">Войти</button>
        </form>

        <p class="back-link"><a href="../index.html">← Вернуться на главную</a></p>
    </div>

</body>
</html>
