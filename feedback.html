<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь — Food Construct</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Выходим из pages и заходим в css -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="../index.html">О нас</a>
            <a href="feedback.html">Обратная связь</a>
            <a href="login.html">Войти</a>
            <a href="../index.html#contacts">Контакты</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Обратная связь</h2>

            <!-- action и method нужны для отправки данных на сервер. enctype обязателен для файлов -->
            <form action="https://postman-echo.com/post" method="POST" enctype="multipart/form-data" target="_blank">

                <label for="fio">ФИО:</label>
                <input type="text" id="fio" name="fio" placeholder="Иванов Иван Иванович" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>

                <p class="field-title">Откуда вы узнали о нас?</p>
                <div class="radio-group">
                    <label><input type="radio" name="source" value="friends" checked> От друзей</label>
                    <label><input type="radio" name="source" value="internet"> Из интернета</label>
                    <label><input type="radio" name="source" value="advertising"> Из рекламы</label>
                </div>

                <label for="type">Тип обращения:</label>
                <select id="type" name="type">
                    <option value="suggestion">Предложение</option>
                    <option value="complaint">Жалоба</option>
                </select>

                <label for="message">Текст сообщения:</label>
                <textarea id="message" name="message" rows="5" placeholder="Напишите ваше сообщение..." required></textarea>

                <label for="file">Вложение:</label>
                <input type="file" id="file" name="file">

                <label class="checkbox-label">
                    <input type="checkbox" name="consent" value="yes" required>
                    Даю согласие на обработку персональных данных
                </label>

                <button type="submit">Отправить</button>
            </form>
        </section>
    </main>

    <footer id="contacts">
        <p>Позвонить нам: <a href="tel:+74959999999">+7 495 999-99-99</a></p>
        <p>Написать нам: <a href="mailto:info@foodconstruct.ru">info@foodconstruct.ru</a></p>
    </footer>

</body>
</html>
